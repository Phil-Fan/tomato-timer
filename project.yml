name: TomatoTimer

options:
  bundleIdPrefix: com.philfan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    # 公证要求 Hardened Runtime；本地 ad-hoc 签名同样可以开启。
    ENABLE_HARDENED_RUNTIME: YES

targets:
  TomatoTimer:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Support/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philfan.tomato
        PRODUCT_NAME: TomatoTimer
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        CODE_SIGN_ENTITLEMENTS: Support/TomatoTimer.entitlements
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 番茄钟
        CFBundleIconFile: AppIcon
        CFBundleName: 番茄钟
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSCalendarsFullAccessUsageDescription: 番茄钟需要访问日历，以便把你完成的专注时段写入你选择的日历，并把标题以分类名开头的日程计入统计。
        NSCalendarsUsageDescription: 番茄钟需要访问日历，以便记录已完成的专注时段，并把标题以分类名开头的日程计入统计。
